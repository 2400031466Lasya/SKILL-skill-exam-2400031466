name: microservices-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: skill-exam-2400031466
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skill-exam-2400031466"]
      interval: 5s
      timeout: 5s
      retries: 10

  exam-service:
    build:
      context: .
      dockerfile: DockerFile
    container_name: exam-service
    image: 2400031466/skill-skill-exam-2400031466:latest
    restart: unless-stopped
    ports:
      - "2004:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/skill-exam-2400031466
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      postgresdb:
        condition: service_healthy

volumes:
  postgres_data: